[workspace]
channels = ["conda-forge"]
platforms = ["win-64"]

[target.win-64.dependencies]
m2-autoconf = ">=2.71.3"
m2-automake-wrapper = ">=20240607.1"
m2-libtool = ">=2.5.4.1"
m2-make = ">=4.4.1.2"
m2-grep = ">=1!3.0.7"
m2-findutils = ">=4.9.0.3"
m2-which = ">=2.23.4"
uv = ">=0.12.5"

[target.win-64.activation]
scripts = ["C:/Program Files/Microsoft Visual Studio/18/Community/VC/Auxiliary/Build/vcvars64.bat"]

[target.win-64.activation.env]
MSYS2_PATH_TYPE = "inherit"

[target.win-64.tasks]
build = { cmd = [
  "uv",
  "run",
  "--no-dev",
  "build.py",
  "--sh",
  "$CONDA_PREFIX/Library/usr/bin/sh.exe",
  "--vs",
  "2026",
  "--python",
  "cpython-3.14",
  "--windows-sdk-version",
  "10.0.28000.0",
] }
